name: Construir app da TV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Construir APK
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          YT_KEY: ${{ secrets.YT_KEY }}
          CAL_ICS_URL: ${{ secrets.CAL_ICS_URL }}
          PEPPA_CHANNEL_ID: ${{ secrets.PEPPA_CHANNEL_ID }}
        run: gradle assembleDebug --no-daemon

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar o APK para descarregar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tv-launcher.apk
          gh release delete tv-launcher-atual --yes --cleanup-tag || true
          gh release create tv-launcher-atual tv-launcher.apk --title "Launcher da TV (mais recente)" --notes "Descarrega o ficheiro tv-launcher.apk e instala na TV."
